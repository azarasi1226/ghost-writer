name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "terraform/**.tf"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install
        working-directory: src

      - name: Build
        run: npm run build
        working-directory: src

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}"
        working-directory: terraform

      - name: Terraform Apply
        if: ${{ github.event_name == 'push' || inputs.action == 'apply' }}
        run: terraform apply -auto-approve
        working-directory: terraform
        env:
          TF_VAR_wp_user: ${{ secrets.WP_USER }}
          TF_VAR_wp_pass: ${{ secrets.WP_PASS }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_gemini_model: ${{ vars.GEMINI_MODEL }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
        working-directory: terraform
        env:
          TF_VAR_wp_user: ${{ secrets.WP_USER }}
          TF_VAR_wp_pass: ${{ secrets.WP_PASS }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_gemini_model: ${{ vars.GEMINI_MODEL }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
