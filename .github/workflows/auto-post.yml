name: Auto Post Article Weekly

on:
  schedule:
    - cron: '0 0 * * 0' # 毎週日曜0時（UTC）に実行
  workflow_dispatch:

jobs:
  autopost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Set environment variables
        run: |
          echo "WP_URL=${{ secrets.WP_URL }}" >> $GITHUB_ENV
          echo "WP_USER=${{ secrets.WP_USER }}" >> $GITHUB_ENV
          echo "WP_PASS=${{ secrets.WP_PASS }}" >> $GITHUB_ENV
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> $GITHUB_ENV
          echo "GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}" >> $GITHUB_ENV

      - name: Start
        run: npm run start
